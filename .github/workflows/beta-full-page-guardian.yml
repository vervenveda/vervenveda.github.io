name: Beta full-page coverage guardian
on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'reports/audit-beta-pages.py'
      - '.github/workflows/beta-full-page-guardian.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all public HTML Beta entry points
        run: python3 reports/audit-beta-pages.py . --json /tmp/beta-full-page-audit.json
      - name: Validate Beta reporting regression checks
        run: python3 -m unittest discover -s reports/tests -v
