name: Agent VNV Arcade Geometry Directory Sync

on:
  push:
    branches:
      - agent/vnv-arcade-geometry-directory-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/vnv-arcade-geometry-directory-sync
          fetch-depth: 0

      - name: Patch exact Arcade Geometry directory records
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '{"title":"Geometry Sanctuary","url":"https://vervenveda.github.io/arcade.github.io/a_geometry_sanctuary_game_index.html","desc":"Geometry-inspired visual puzzle world."}':
              '{"title":"Geometry Sanctuary","url":"https://vervenveda.github.io/arcade.github.io/Geometry/Sanctuary%20V2.0","desc":"Sacred Geometry Sanctuary V2.0 with Mandala Builder, Geometry Battle, Geometry Lab, Player Guide, and a local Sanctuary Library."}',

              '{"title":"Mandala Rings","url":"https://vervenveda.github.io/arcade.github.io/a_mandala_rings_game_index.html","desc":"Pattern and ring puzzle."}':
              '{"title":"Mandala Rings","url":"https://vervenveda.github.io/arcade.github.io/Geometry/mandala_rings_game_index.html","desc":"Strategic board game and pattern studio with AI levels, movement phases, symmetry scoring, and local pattern favorites."}',

              '{"title":"Sacred Geometry","url":"https://vervenveda.github.io/arcade.github.io/a_sacred_geometry_game_index.html","desc":"Geometry and pattern exploration."}':
              '{"title":"Sacred Geometry","url":"https://vervenveda.github.io/arcade.github.io/Geometry/sacred_geometry_game_index.html","desc":"Radial mandala studio and tactical geometry duel with editable layers, local saves, and stable exports."}',
          }

          changed = False
          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new)
                  changed = True
              elif count == 0 and new in text:
                  # Already patched: safe no-op.
                  continue
              else:
                  raise SystemExit(f"Expected exactly one old record or one already-patched record; found {count}: {old[:80]}")

          # Hard validation: old aliases must be absent and new paths present exactly once.
          expected_new = [
              "Geometry/Sanctuary%20V2.0",
              "Geometry/mandala_rings_game_index.html",
              "Geometry/sacred_geometry_game_index.html",
          ]
          stale = [
              "a_geometry_sanctuary_game_index.html",
              "a_mandala_rings_game_index.html",
              "a_sacred_geometry_game_index.html",
          ]

          for item in stale:
              if item in text:
                  raise SystemExit(f"Stale Arcade Geometry alias remains: {item}")
          for item in expected_new:
              if text.count(item) != 1:
                  raise SystemExit(f"Expected one new Arcade Geometry path, found {text.count(item)}: {item}")

          if changed:
              path.write_text(text, encoding="utf-8")

      - name: Validate inline JavaScript syntax and directory JSON
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          import re
          import subprocess
          import tempfile

          text = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'const\s+ECOSYSTEM_DIRECTORY\s*=\s*(\[.*?\]);\s*\n\s*let\s+activeEcosystemCategory', text, re.S)
          if not match:
              raise SystemExit("ECOSYSTEM_DIRECTORY not found")
          json.loads(match.group(1))

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.attrs = {}
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.in_script = True
                      self.attrs = dict(attrs)
                      self.buf = []
              def handle_data(self, data):
                  if self.in_script:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append((self.attrs, "".join(self.buf)))
                      self.in_script = False

          parser = Scripts()
          parser.feed(text)
          for index, (attrs, body) in enumerate(parser.scripts, 1):
              typ = attrs.get("type", "").lower()
              if attrs.get("src") or (typ and typ not in ("text/javascript", "application/javascript", "module")) or not body.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as fh:
                  fh.write(body)
                  filename = fh.name
              subprocess.run(["node", "--check", filename], check=True)

      - name: Commit patched index when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Directory already synchronized; nothing to commit."
            exit 0
          fi
          git config user.name "vervenveda-directory-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync Arcade Geometry paths in VNV master directory"
          git push origin HEAD:agent/vnv-arcade-geometry-directory-sync
