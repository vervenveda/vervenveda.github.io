name: VNV Academy Account Cloud source caller tests
on:
  push:
    paths:
      - 'tools/account-cloud-source-caller.mjs'
      - 'tests/account-cloud-source-caller.test.mjs'
      - 'tools/account-cloud-reconcile-dry-run.mjs'
      - 'tests/account-cloud-reconcile-dry-run.test.mjs'
      - '.github/workflows/account-cloud-source-caller-tests.yml'
  pull_request:
    paths:
      - 'tools/account-cloud-source-caller.mjs'
      - 'tests/account-cloud-source-caller.test.mjs'
      - 'tools/account-cloud-reconcile-dry-run.mjs'
      - 'tests/account-cloud-reconcile-dry-run.test.mjs'
      - '.github/workflows/account-cloud-source-caller-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-source-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic source caller regression (no private credentials or network requests)
        run: node --test tests/account-cloud-source-caller.test.mjs tests/account-cloud-reconcile-dry-run.test.mjs
