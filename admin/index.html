<html lang="en">
<head>

<title>ADMIN</title>
<style>
:root{
  --bg:#0e1117;--panel:#0d1117;--panel2:#161b22;--ink:#e6edf3;--muted:#8b949e;
  --line:#30363d;--green:#2ea043;--red:#a92323;--gold:#b48b45;--paper:#f7f4ed;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

#gate{
  position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 20%,#1b2a24,#0b0f0d 55rem)
}
.gate-card{
  width:min(100%,460px);padding:30px;border:1px solid #61423a;border-top:4px solid var(--red);
  border-radius:12px;background:var(--paper);color:#111;box-shadow:0 30px 80px #0008
}
.gate-kicker{color:#8e2424;font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}
.gate-card h1{margin:0 0 24px;font-family:Georgia,serif;font-weight:500;font-size:44px;letter-spacing:.11em;text-align:center}\n.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.gate-card p{font-family:system-ui,sans-serif;color:#4d5751;font-size:13px;line-height:1.6}
.gate-form{display:grid;gap:14px;margin-top:0}
.gate-form label{font-family:system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.code-row{display:grid;grid-template-columns:1fr 76px;gap:8px}
.code-input{min-height:50px;padding:0 14px;border:1px solid #aeb7b2;border-radius:7px;background:#fff;color:#111;font-size:18px;letter-spacing:.16em}
.show-btn,.gate-submit,.secondary{min-height:46px;border-radius:7px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.show-btn,.secondary{border:1px solid #aeb7b2;background:#fff;color:#111}
.gate-submit{border:1px solid #7f1717;background:var(--red);color:#fff}
.status{min-height:22px;margin:0!important;font-family:system-ui,sans-serif;font-size:12px;font-weight:700}
.status.error{color:#9d2626}.status.ok{color:#26633d}
.gate-note{margin-top:18px!important;padding:10px 12px;border-left:2px solid var(--gold);background:#fff;font-size:11px!important}
body.unlocked #gate{display:none}
body:not(.unlocked) #cloudRoot{display:none}

#cloudRoot{height:100%;display:grid;grid-template-rows:48px minmax(0,1fr)}
#cloudHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px;background:#0b0f14;border-bottom:1px solid #222}
#cloudHeader strong{font-family:system-ui,sans-serif;letter-spacing:.06em}
.header-actions{display:flex;gap:6px}
.header-actions button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 9px}
#cloudBody{display:flex;min-height:0}

#sidebar{width:280px;border-right:1px solid #222;padding:10px;overflow-y:auto;background:#0e1117}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
button{background:#161b22;color:#e6edf3;border:1px solid #30363d;padding:6px;margin:2px 0}
button:hover{background:#21262d}
ul{list-style:none;padding-left:14px;margin:0}
li{cursor:pointer;margin:4px 0}
.folder::before{content:"📁 "}.file::before{content:"📄 "}.app::before{content:"🚀 "}
#editor{flex:1;background:#0d1117;color:#e6edf3;border:none;padding:10px;resize:none}
#imagePreview{max-width:100%;max-height:40vh;display:none;margin-top:8px;object-fit:contain;background:#05070c;border-radius:4px}
#path{background:#161b22;padding:6px;font-size:12px}
#toolbar{padding:6px;background:#0d1117}

#changeOverlay{
  position:fixed;inset:0;z-index:9000;display:none;place-items:center;padding:20px;background:#000b
}
#changeOverlay.open{display:grid}
.change-card{width:min(100%,460px);padding:26px;background:var(--paper);color:#111;border-radius:11px;box-shadow:0 30px 80px #0008}
.change-card h2{margin:0 0 10px;font-family:Georgia,serif;font-weight:500}
.change-card form{display:grid;gap:10px}
.change-card input{min-height:46px;padding:0 12px;border:1px solid #aeb7b2;border-radius:7px}
.change-actions{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:700px){
  #cloudBody{display:block;overflow:auto}
  #sidebar{width:100%;max-height:42vh;border-right:0;border-bottom:1px solid #222}
  #main{min-height:58vh}
  .code-row{grid-template-columns:1fr}
}

.vault-view{display:none;min-height:0;height:100%}
.vault-view.active{display:flex}
#adminDashboardView{background:#f4f0e7}
#adminDashboardFrame{width:100%;height:100%;border:0;background:#f4f0e7}
#cloudBody.active{display:flex}
.header-actions button.view-active{background:#243d33;color:#fff;border-color:#476759}
@media(max-width:700px){
  #adminDashboardView{height:calc(100vh - 48px)}
  #cloudBody.active{display:block}
}

</style>

        <button class="show-btn" id="showCode" type="button">Show</button>
      </div>
      <p class="status" id="gateStatus" role="status" aria-live="polite"></p>
      <button class="gate-submit" type="submit">Enter</button>
    </form>
  </div>
</section>

      <button id="changePasscode">Change Passcode</button>

    (() =&gt; {
      &quot;use strict&quot;;

      const SESSION_KEY = &quot;VNV_ADMIN_GATE_SESSION_V2&quot;;
      const portal = document.getElementById(&quot;portal&quot;);
      const blocked = document.getElementById(&quot;blocked&quot;);
      const year = document.getElementById(&quot;year&quot;);

      function isUnlocked(){
        try{
          const value = JSON.parse(sessionStorage.getItem(SESSION_KEY) || &quot;null&quot;);
          return Boolean(value?.unlocked);
        }catch{
          return false;
        }
      }

      function lockAndReturn(){
        try{ sessionStorage.removeItem(SESSION_KEY); }catch{}
        window.location.replace(&quot;/&quot;);
      }

      if(year) year.textContent = String(new Date().getFullYear());

      if(isUnlocked()){
        portal.hidden = false;
        blocked.hidden = true;
      }else{
        portal.hidden = true;
        blocked.hidden = false;
      }

      document.getElementById(&quot;lockSession&quot;)?.addEventListener(&quot;click&quot;,lockAndReturn);
      document.getElementById(&quot;lockSessionCard&quot;)?.addEventListener(&quot;click&quot;,lockAndReturn);
    })();
  &lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;"></iframe>
  </section>

  <div id="cloudBody" class="vault-view">
    <div id="sidebar">
      <h3>Mini Cloud OS</h3>
      <button onclick="newFolder()">+ Folder</button>
      <button onclick="newFile()">+ File</button>
      <button onclick="uploadFile()">🖼 Upload File</button>
      <button onclick="exportCloud()">📦 Export</button>
      <button onclick="importCloud()">📥 Import</button>
      <ul id="tree"></ul>
    </div>

    <div id="main">
      <div id="path">/</div>
      <textarea id="editor" placeholder="Select a file to edit..."></textarea>
      <img id="imagePreview" alt="Image preview">
      <div id="toolbar">
        <button onclick="saveFile()">💾 Save</button>
        <button onclick="showVersions()">🧬 Versions</button>
        <button onclick="launchApp()">🚀 Launch App</button>
        <button onclick="deleteItem()">🗑 Delete</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" hidden accept="image/*,.txt,.md,.json,.html,.css,.js,.pdf,.doc,.docx">

<div id="changeOverlay">
  <section class="change-card">
    <h2>Change Mini Cloud Passcode</h2>
    <p style="font-family:system-ui,sans-serif;color:#55615a;font-size:13px">Enter the current 10-digit code, then your new 10-digit code twice.</p>
    <form id="changeForm">
      <input id="currentCode" type="password" inputmode="numeric" maxlength="10" placeholder="Current 10-digit code" required>
      <input id="newCode" type="password" inputmode="numeric" maxlength="10" placeholder="New 10-digit code" required>
      <input id="confirmCode" type="password" inputmode="numeric" maxlength="10" placeholder="Confirm new code" required>
      <p class="status" id="changeStatus"></p>
      <div class="change-actions">
        <button class="gate-submit" type="submit">Save New Passcode</button>
        <button class="secondary" id="cancelChange" type="button">Cancel</button>
      </div>
    </form>
  </section>
</div>

<script>
/* =========================================================
   PASSCODE GATE — same core logic as Verve N Veda home gate
   ========================================================= */
// Shared with the public-home Admin Gate.\nconst RECORD_KEY="VNV_ADMIN_GATE_RECORD_V2";
const SESSION_KEY="VNV_MINI_CLOUD_SESSION_V2";
const ATTEMPT_KEY="VNV_MINI_CLOUD_FAILED_ATTEMPTS_V2";
const DEFAULT_CODE="0000000000";
const ITERATIONS=120000;
const encoder=new TextEncoder();

const gateCode=document.getElementById("gateCode");
const showCode=document.getElementById("showCode");
const gateForm=document.getElementById("gateForm");
const gateStatus=document.getElementById("gateStatus");
const lockCloud=document.getElementById("lockCloud");
const changePasscode=document.getElementById("changePasscode");
const changeOverlay=document.getElementById("changeOverlay");
const cancelChange=document.getElementById("cancelChange");
const changeForm=document.getElementById("changeForm");
const currentCode=document.getElementById("currentCode");
const newCode=document.getElementById("newCode");
const confirmCode=document.getElementById("confirmCode");
const changeStatus=document.getElementById("changeStatus");

function cleanCode(v){return String(v||"").replace(/\D/g,"").slice(0,10)}
function isValidCode(v){return /^[0-9]{10}$/.test(String(v||""))}
function bytesToBase64(bytes){let binary="";bytes.forEach(b=>binary+=String.fromCharCode(b));return btoa(binary)}
function base64ToBytes(v){return Uint8Array.from(atob(v),c=>c.charCodeAt(0))}
async function derive(code,salt){
  const material=await crypto.subtle.importKey("raw",encoder.encode(code),{name:"PBKDF2"},false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:ITERATIONS,hash:"SHA-256"},material,256);
  return new Uint8Array(bits)
}
function constantTimeEqual(a,b){if(a.length!==b.length)return false;let diff=0;for(let i=0;i<a.length;i++)diff|=a[i]^b[i];return diff===0}
function readRecord(){try{const raw=localStorage.getItem(RECORD_KEY);return raw?JSON.parse(raw):null}catch{return null}}
async function verify(code){
  if(!isValidCode(code))return false;
  const record=readRecord();
  if(!record?.salt||!record?.hash)return code===DEFAULT_CODE;
  try{return constantTimeEqual(await derive(code,base64ToBytes(record.salt)),base64ToBytes(record.hash))}catch{return false}
}
async function saveNewCode(code){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const hash=await derive(code,salt);
  localStorage.setItem(RECORD_KEY,JSON.stringify({
    version:2,algorithm:"PBKDF2-SHA256",iterations:ITERATIONS,
    salt:bytesToBase64(salt),hash:bytesToBase64(hash),changedAt:new Date().toISOString()
  }))
}
function setUnlocked(v){
  try{
    if(v){
      sessionStorage.setItem(SESSION_KEY,"1");
      sessionStorage.setItem("VNV_ADMIN_GATE_SESSION_V2",JSON.stringify({unlocked:true,at:new Date().toISOString()}));
    }else{
      sessionStorage.removeItem(SESSION_KEY);
      sessionStorage.removeItem("VNV_ADMIN_GATE_SESSION_V2");
    }
  }catch{}
}
function isUnlocked(){try{return sessionStorage.getItem(SESSION_KEY)==="1"}catch{return false}}
function getFailedAttempts(){
  try{return Math.max(0,parseInt(sessionStorage.getItem(ATTEMPT_KEY)||"0",10)||0)}catch{return 0}
}
function setFailedAttempts(n){
  try{sessionStorage.setItem(ATTEMPT_KEY,String(Math.max(0,n|0)))}catch{}
}
function wrongPasscodeMessage(attempt){
  if(attempt===1) return "Wrong password! You unlocked a new achievement: 'Most Predictable Guess of the Day'.";
  if(attempt===2) return "Access rejected. My cat walked across the keyboard and almost guessed a better password.";
  if(attempt===3) return "Incorrect. Please consult a magic 8-ball for better password guessing abilities.";
  if(attempt===4) return "Incorrect password. This computer is now judging your life choices.";
  if(attempt===5) return "Password incorrect. Your IP address has been reported to the Cyber Police of Disappointment.";
  return "Access rejected. Incorrect administrator passcode.";
}
function renderGate(){document.body.classList.toggle("unlocked",isUnlocked());if(!isUnlocked())setTimeout(()=>gateCode.focus(),40)}

["gateCode","currentCode","newCode","confirmCode"].forEach(id=>document.getElementById(id).addEventListener("input",e=>e.target.value=cleanCode(e.target.value)));

showCode.onclick=()=>{const show=gateCode.type==="password";gateCode.type=show?"text":"password";showCode.textContent=show?"Hide":"Show";gateCode.focus()};

gateForm.onsubmit=async e=>{
  e.preventDefault();
  const code=cleanCode(gateCode.value);
  if(!isValidCode(code)){gateStatus.textContent="Enter exactly 10 digits.";gateStatus.className="status error";return}
  gateStatus.textContent="Checking gate…";gateStatus.className="status";
  if(!(await verify(code))){
    const attempt=getFailedAttempts()+1;
    setFailedAttempts(attempt);
    gateStatus.textContent=wrongPasscodeMessage(attempt);
    gateStatus.className="status error";
    gateCode.select();
    return
  }
  setFailedAttempts(0);
  if(!readRecord())await saveNewCode(code);
  setUnlocked(true);
  gateStatus.textContent="";
  renderGate();
  showVaultView("dashboard");
};

lockCloud.onclick=()=>{setUnlocked(false);setFailedAttempts(0);gateCode.value="";gateStatus.textContent="";renderGate();showVaultView("dashboard")};
changePasscode.onclick=()=>changeOverlay.classList.add("open");
cancelChange.onclick=()=>{changeOverlay.classList.remove("open");changeStatus.textContent=""};

changeForm.onsubmit=async e=>{
  e.preventDefault();
  const current=cleanCode(currentCode.value),next=cleanCode(newCode.value),confirm=cleanCode(confirmCode.value);
  if(!isValidCode(current)||!isValidCode(next)||!isValidCode(confirm)){
    changeStatus.textContent="All fields must contain exactly 10 digits.";
    changeStatus.className="status error";
    return
  }
  if(next!==confirm){
    changeStatus.textContent="The new passcodes do not match.";
    changeStatus.className="status error";
    return
  }
  if(!(await verify(current))){
    changeStatus.textContent="The current passcode was not accepted.";
    changeStatus.className="status error";
    return
  }
  await saveNewCode(next);
  changeStatus.textContent="New passcode saved to this browser.";
  changeStatus.className="status ok";
  currentCode.value=newCode.value=confirmCode.value=""
};

renderGate();
showVaultView("dashboard");

function showVaultView(view){
  const dash=document.getElementById("adminDashboardView");
  const cloud=document.getElementById("cloudBody");
  const showDash=view!=="cloud";
  dash.classList.toggle("active",showDash);
  cloud.classList.toggle("active",!showDash);
  document.getElementById("showDashboard")?.classList.toggle("view-active",showDash);
  document.getElementById("showCloud")?.classList.toggle("view-active",!showDash);

  // Refresh the embedded admin page when returning to it so it re-reads the shared session.
  if(showDash){
    const frame=document.getElementById("adminDashboardFrame");
    if(frame){
      const source=frame.getAttribute("srcdoc");
      frame.setAttribute("srcdoc",source);
    }
  }
}
document.getElementById("showDashboard").onclick=()=>showVaultView("dashboard");
document.getElementById("showCloud").onclick=()=>showVaultView("cloud");


const adminFrame=document.getElementById("adminDashboardFrame");
adminFrame.addEventListener("load",()=>{
  try{
    const doc=adminFrame.contentDocument;
    if(!doc)return;
    ["lockSession","lockSessionCard"].forEach(id=>{
      const btn=doc.getElementById(id);
      if(btn){
        btn.onclick=(e)=>{
          e.preventDefault();
          setUnlocked(false);
          gateCode.value="";
          renderGate();
          showVaultView("dashboard");
        };
      }
    });
  }catch{}
});

/* =========================================================
   ORIGINAL MINI CLOUD FILESYSTEM
   ========================================================= */

/* ==========================
   MINI CLOUD CONTENT HANDLING
   The passcode gate protects entry into the UI.
   Stored file contents remain browser-local and are not encrypted.
========================== */

function encrypt(text){
  // kept for compatibility – just returns plain text
  return text == null ? "" : String(text);
}
function decrypt(data){
  return data == null ? "" : String(data);
}

/* DOM refs */
const editor       = document.getElementById("editor");
const imagePreview = document.getElementById("imagePreview");
const fileInput    = document.getElementById("fileInput");

/* ==========================
   FILESYSTEM
========================== */
let fs = JSON.parse(localStorage.getItem("VNV_MINI_CLOUD_FS_V2") || "null");
if (!fs) {
  fs = {
    name: "root",
    type: "folder",
    children: [
      { name:"apps", type:"folder", children:[] }
    ]
  };
}

let currentNode = null;
let currentPath = [];

/* ==========================
   TREE RENDER
========================== */
function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  renderNode(fs, tree, []);
}

function renderNode(node, parent, path) {
  node.children?.forEach((child, i) => {
    const li = document.createElement("li");
    li.textContent = child.name;
    li.className = (child.type === "file" && child.name === "index.html")
      ? "app"
      : child.type;
    li.onclick = e => {
      e.stopPropagation();
      openNode(child, path.concat(i));
    };
    parent.appendChild(li);
    if (child.type === "folder") {
      const ul = document.createElement("ul");
      parent.appendChild(ul);
      renderNode(child, ul, path.concat(i));
    }
  });
}

function lookup(path) {
  return path.reduce((n,i)=>n.children[i], fs);
}

/* ==========================
   PATH / OPEN
========================== */
function updatePathBar(path) {
  const pathEl = document.getElementById("path");
  if (!path.length) {
    pathEl.textContent = "/";
    return;
  }
  const parts = path.map((_,i)=>lookup(path.slice(0,i+1)).name);
  pathEl.textContent = "/" + parts.join("/");
}

function openNode(node, path) {
  currentNode = node;
  currentPath = path;
  updatePathBar(path);

  if (node.type !== "file") {
    editor.value = "";
    imagePreview.style.display = "none";
    imagePreview.src = "";
    return;
  }

  // Detect file kind (image vs text)
  const kind = node.fileKind ||
    (typeof node.content === "string" && node.content.startsWith("data:image/") ? "image" : "text");

  if (kind === "image") {
    editor.value = "";
    imagePreview.style.display = "block";
    imagePreview.src = node.content || "";
  } else {
    const raw = decrypt(node.content || "");
    editor.value = raw;
    imagePreview.style.display = "none";
    imagePreview.src = "";
  }
}

/* Parent of the currently selected node (or fs if root) */
function parentFolder() {
  return currentPath.length ? lookup(currentPath.slice(0,-1)) : fs;
}

/* Choose which folder new items should go into */
function getTargetFolderForNew() {
  if (currentNode && currentNode.type === "folder") {
    return currentNode;
  }
  return parentFolder();
}

/* ==========================
   ACTIONS: NEW FOLDER / FILE
========================== */
function newFolder() {
  const name = prompt("Folder name?");
  if (!name) return;

  const target = getTargetFolderForNew();
  target.children = target.children || [];

  target.children.push({ name, type:"folder", children:[] });
  const newIndex = target.children.length - 1;

  let basePath;
  if (currentNode && currentNode.type === "folder") {
    basePath = currentPath.slice();
  } else {
    basePath = currentPath.slice(0, -1);
  }
  const newPath = basePath.concat(newIndex);

  persist();
  openNode(lookup(newPath), newPath);
}

function newFile() {
  const name = prompt("File name?");
  if (!name) return;

  const target = getTargetFolderForNew();
  target.children = target.children || [];

  target.children.push({
    name,
    type:"file",
    content:"",
    versions:[],
    fileKind:"text"
  });
  const newIndex = target.children.length - 1;

  let basePath;
  if (currentNode && currentNode.type === "folder") {
    basePath = currentPath.slice();
  } else {
    basePath = currentPath.slice(0, -1);
  }
  const newPath = basePath.concat(newIndex);

  persist();
  openNode(lookup(newPath), newPath);
}

/* ==========================
   ACTIONS: UPLOAD FILE
========================== */
function uploadFile() {
  fileInput.value = "";
  fileInput.click();
}

fileInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  const target = getTargetFolderForNew();
  target.children = target.children || [];

  const isImage = file.type.startsWith("image/");
  const reader = new FileReader();

  reader.onload = () => {
    const node = {
      name: file.name,
      type: "file",
      content: reader.result,
      versions: [],
      fileKind: isImage ? "image" : "text",
      mime: file.type || undefined
    };
    target.children.push(node);

    const newIndex = target.children.length - 1;

    let basePath;
    if (currentNode && currentNode.type === "folder") {
      basePath = currentPath.slice();
    } else {
      basePath = currentPath.slice(0, -1);
    }
    const newPath = basePath.concat(newIndex);

    persist();
    openNode(lookup(newPath), newPath);
  };

  if (isImage) {
    reader.readAsDataURL(file);   // for <img src="...">
  } else {
    reader.readAsText(file);
  }
});

/* ==========================
   SAVE / VERSIONS / APP LAUNCH
========================== */
function saveFile() {
  if (!currentNode || currentNode.type !== "file") return;

  if (currentNode.fileKind === "image") {
    alert("Image files can't be edited here. Upload a new image file to replace it.");
    return;
  }

  // initialize versions array if needed
  currentNode.versions = currentNode.versions || [];

  // keep previous content as a version (if defined)
  if (typeof currentNode.content === "string") {
    currentNode.versions.unshift(currentNode.content);
  }
  currentNode.versions = currentNode.versions.slice(0,10);

  // store plain content
  currentNode.content = encrypt(editor.value);
  persist();
}

function showVersions() {
  if (!currentNode || currentNode.type !== "file") {
    alert("Select a file to view versions.");
    return;
  }
  if (currentNode.fileKind === "image") {
    alert("Version restore is not available for image files.");
    return;
  }
  if (!currentNode.versions || !currentNode.versions.length) {
    alert("No versions recorded for this file yet.");
    return;
  }
  const indexStr = prompt(
    `Restore version index:\n0 = most recent previous version\n(Available: 0–${currentNode.versions.length - 1})`
  );
  if (indexStr === null) return;
  const v = parseInt(indexStr, 10);
  if (isNaN(v) || v < 0 || v >= currentNode.versions.length) {
    alert("Invalid version index.");
    return;
  }
  currentNode.content = currentNode.versions[v];
  editor.value = decrypt(currentNode.content);
  persist();
}

function launchApp() {
  if (currentNode?.type === "file" && currentNode.name === "index.html") {
    const html = decrypt(currentNode.content || "");
    const win = window.open();
    if (win) {
      win.document.write(html);
      win.document.close();
    } else {
      alert("Popup blocked. Please allow popups for this site to launch the app.");
    }
  } else {
    alert('Select an "index.html" file inside an app folder to launch.');
  }
}

/* ==========================
   DELETE
========================== */
function deleteItem() {
  if (!currentNode || !currentPath.length) {
    alert("Select a file or folder to delete.");
    return;
  }
  if (!confirm(`Delete "${currentNode.name}"? This cannot be undone.`)) {
    return;
  }
  const parent = parentFolder();
  const idx = currentPath[currentPath.length - 1];
  parent.children.splice(idx, 1);

  currentNode = null;
  currentPath = [];
  editor.value = "";
  imagePreview.style.display = "none";
  imagePreview.src = "";
  updatePathBar([]);

  persist();
}

/* ==========================
   EXPORT / IMPORT
========================== */
function exportCloud() {
  const blob = new Blob([JSON.stringify(fs, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mini-cloud.json";
  a.click();
}

function importCloud() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(reader.result);
        // minimal validation: must at least be a folder root
        if (!imported || imported.type !== "folder" || !Array.isArray(imported.children)) {
          alert("Invalid cloud file format.");
          return;
        }
        fs = imported;
        currentNode = null;
        currentPath = [];
        editor.value = "";
        imagePreview.style.display = "none";
        imagePreview.src = "";
        updatePathBar([]);
        persist();
      } catch (err) {
        alert("Could not import cloud file (invalid JSON).");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ==========================
   PERSIST
========================== */
function persist() {
  localStorage.setItem("VNV_MINI_CLOUD_FS_V2", JSON.stringify(fs));
  renderTree();
}

renderTree();
updatePathBar([]);

</script>
