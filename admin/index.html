<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Verve N Veda — Passage Resting</title>
<style>
:root{
  --parchment:#f7f3ea;
  --parchment-soft:#f5efe3;
  --parchment-deep:#f0e9dc;
  --gold:#d9b878;
  --gold-soft:#e8d5a4;
  --gold-deep:#b89252;
  --gold-root:#7a5a28;
  --midnight:#0b1020;
  --midnight-deep:#020414;
  --r7:7px; --r11:11px; --r21:21px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:33px 21px;
  color:var(--midnight);
  font-family:Georgia,"Times New Roman",serif;
  background:
    radial-gradient(circle at 50% 14%,rgba(217,184,120,.24),transparent 33%),
    linear-gradient(144deg,var(--parchment),var(--parchment-soft) 55%,var(--parchment-deep));
}
.shell{
  width:min(720px,100%);
  text-align:center;
  padding:33px;
  border:1px solid var(--gold-soft);
  border-radius:21px;
  background:rgba(247,243,234,.88);
  box-shadow:0 21px 72px rgba(11,16,32,.12);
}
.mark{
  width:72px;height:72px;
  margin:0 auto 21px;
  display:grid;place-items:center;
  border:1px solid var(--gold);
  border-radius:50%;
  font-family:Georgia,serif;
  font-size:33px;
  color:var(--gold-root);
  background:var(--parchment-soft);
  box-shadow:inset 0 0 0 7px var(--parchment),0 7px 21px rgba(122,90,40,.14);
}
.eyebrow{
  margin:0 0 7px;
  font-size:12px;
  letter-spacing:.21em;
  text-transform:uppercase;
  color:var(--gold-root);
}
h1{
  margin:0;
  font-size:clamp(27px,5vw,40px);
  line-height:1.33;
  font-weight:normal;
  letter-spacing:.03em;
  color:var(--midnight-deep);
}
.rule{
  width:108px;height:1px;
  margin:21px auto;
  border:0;
  background:linear-gradient(90deg,transparent,var(--gold-deep),transparent);
}
p{
  max-width:540px;
  margin:0 auto;
  font-size:18px;
  line-height:1.7;
  color:#3b352d;
}
.actions{margin-top:27px}
a{
  display:inline-block;
  padding:11px 21px;
  border:1px solid var(--gold-deep);
  border-radius:11px;
  background:linear-gradient(180deg,var(--gold-soft),var(--gold));
  color:var(--midnight-deep);
  text-decoration:none;
  font-size:14px;
  letter-spacing:.07em;
  transition:transform .18s ease,box-shadow .18s ease;
}
a:hover{transform:translateY(-1px);box-shadow:0 7px 21px rgba(122,90,40,.18)}
footer{
  margin-top:33px;
  font-size:11px;
  letter-spacing:.11em;
  text-transform:uppercase;
  color:var(--gold-root);
}
@media(max-width:600px){
  body{padding:21px 12px}
  .shell{padding:27px 18px}
}
</style>
</head>
<body>
<main class="shell" aria-labelledby="pageTitle">
  <div class="mark" aria-hidden="true">V</div>
  <div class="eyebrow">Verve N Veda</div>
  <h1 id="pageTitle">This Passage Is Resting</h1>
  <hr class="rule">
  <p>
    This private passage is presently unavailable while the Verve N Veda
    ecosystem is being tended. Nothing is required here at this time.
  </p>
  <div class="actions">
    <a href="../">Return to Verve N Veda</a>
  </div>
  <footer>Verve N Veda · Sovereign Creative Ecosystem</footer>
</main>
</body>
</html>
